name: Build check (main)

# O portão de qualidade completo (lint + tokens + build + testes) vive em
# ci.yml e roda em main e dev. Aqui fica só a checagem de build da main,
# mantida por ser o que a Vercel também executa antes de publicar.
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      # Sanity build (sem migração de banco) — falha rápido em erro de compilação.
      - name: Build check (CI)
        run: npm run build:ci
        env:
          NODE_ENV: production
          # Valores descartáveis, só para o build compilar. Os guards de
          # `session.ts`/`middleware.ts` são fail-closed em produção e abortam
          # o build se SESSION_SECRET não existir. Nenhuma sessão real é
          # assinada aqui e nenhum banco é acessado — o deploy de verdade roda
          # na Vercel, com as variáveis reais do projeto.
          SESSION_SECRET: ci-build-check-secret-nao-usado-em-runtime-32
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci

      # ===== Deploy =====
      # Não há passo de deploy aqui de propósito. A integração Git nativa da
      # Vercel está conectada a este repositório e publica em produção a cada
      # push na main (e cria preview em PR). Um `vercel deploy --prod` aqui
      # duplicaria a publicação e faria dois builds concorrerem pelo mesmo
      # alias. Este workflow é só o portão de qualidade: lint + build check.
