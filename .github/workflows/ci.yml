name: CI (lint + tokens + build + testes)

# Portão de qualidade de TODO ramo de trabalho (03 §4.6: "build:ci e testes
# verdes"). O deploy continua sendo da integração Git da Vercel — este
# workflow não publica nada.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    # Banco real para a suíte: os testes financeiros exercitam constraints,
    # gatilhos e transações — mock não provaria nada disso.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: b2cdev
          POSTGRES_PASSWORD: b2cdev
          POSTGRES_DB: b2c_finance_test
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: local
      ALLOW_DESTRUCTIVE: 'true'
      SESSION_SECRET: ci-secret-nao-usado-em-runtime-32-caracteres
      POSTGRES_PRISMA_URL: postgres://b2cdev:b2cdev@127.0.0.1:55432/b2c_finance_test
      POSTGRES_URL_NON_POOLING: postgres://b2cdev:b2cdev@127.0.0.1:55432/b2c_finance_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      # As roles que a migration de segurança espera existem no Supabase,
      # não num Postgres novo (mesma pegadinha do banco local).
      - name: Preparar roles do banco
        run: |
          PGPASSWORD=b2cdev psql -h 127.0.0.1 -p 55432 -U b2cdev -d b2c_finance_test \
            -c "DO \$\$ BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
                END \$\$;"

      # O banco do CI nasce VAZIO, como uma instalação nova de produção. O seed
      # chama o MESMO bootstrap do deploy (admin, workspace, agência, plano de
      # contas, métricas e regras) — então o CI prova o caminho da instalação
      # limpa, não um atalho só dele.
      - name: Migrations e seeds do banco de testes
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed-dev.ts
        env:
          ADMIN_PASSWORD: senha-descartavel-do-ci-nao-usada-em-runtime

      - name: Lint
        run: npm run lint

      # 02 §7.10: cor crua de Tailwind não cresce. A linha de base fotografa
      # o legado; só o que é NOVO reprova.
      - name: Tokens de design
        run: npm run lint:tokens

      # T5 — auditoria AA mecânica: achado grave reprova o ramo.
      - name: Auditoria de acessibilidade (AA)
        run: npm run audit:aa

      - name: Build
        run: npm run build:ci
        env:
          NODE_ENV: production

      - name: Testes
        run: npm test

      # F1.6 — o razão tem de fechar e, quando ligado, cobrir os fatos.
      # Um razão balanceado e VAZIO passa no balanço e não serve para nada:
      # é a bandeira desligada por engano, e esta etapa pega isso.
      - name: Razão (débito = crédito e cobertura)
        run: npm run verify:ledger

      # F2.8 — as fotografias dos meses fechados continuam batendo com os
      # fatos que as geraram. Pega linha alterada depois do fechamento e
      # fotografia escrita por fora do sistema.
      - name: Integridade das fotografias
        run: npm run verify:snapshots

  # P0.1 da auditoria de relatórios (10/09/2026): os PDFs perdiam coluna e
  # linha, e o defeito só aparecia ABRINDO o arquivo. Esta etapa gera os 18
  # documentos num Chrome de verdade, extrai o TEXTO de dentro do PDF e
  # confere colunas, contagem de linhas, páginas órfãs e transbordo. Fica em
  # job próprio porque baixa um navegador — o portão de qualidade principal
  # não pode ficar mais lento por causa disto.
  pdfs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: b2cdev
          POSTGRES_PASSWORD: b2cdev
          POSTGRES_DB: b2c_finance_test
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: local
      ALLOW_DESTRUCTIVE: 'true'
      SESSION_SECRET: ci-secret-nao-usado-em-runtime-32-caracteres
      POSTGRES_PRISMA_URL: postgres://b2cdev:b2cdev@127.0.0.1:55432/b2c_finance_test
      POSTGRES_URL_NON_POOLING: postgres://b2cdev:b2cdev@127.0.0.1:55432/b2c_finance_test
      ADMIN_PASSWORD: senha-descartavel-do-ci-nao-usada-em-runtime

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Preparar roles do banco
        run: |
          PGPASSWORD=b2cdev psql -h 127.0.0.1 -p 55432 -U b2cdev -d b2c_finance_test \
            -c "DO \$\$ BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
                END \$\$;"

      - name: Migrations e seeds
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed-dev.ts

      # Os cinco tamanhos do teste 12 (0, 1, 8, 9 e 130 registros), com nomes
      # longos, acentos e valor negativo. Sem eles a verificação passaria num
      # banco de três linhas e não provaria paginação nenhuma.
      - name: Dataset de estresse dos relatórios
        run: npm run seed:relatorios

      - name: Navegador headless
        run: npx playwright-core install --with-deps chromium

      - name: Build e servidor
        run: |
          npm run build:ci
          npx next start -p 3100 &
          until curl -sf -o /dev/null http://127.0.0.1:3100/login; do sleep 2; done
        env:
          NODE_ENV: production

      - name: Integridade dos PDFs (18 relatórios + 5 tamanhos)
        run: npm run verificar:pdfs -- --base http://127.0.0.1:3100 --saida docs/pdfs-v2/ci

      - name: Guardar os PDFs gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-relatorios
          path: docs/pdfs-v2/ci
          if-no-files-found: ignore
